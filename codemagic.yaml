workflows:
  ios-testflight:
    name: PlayUp iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: mine
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.playup.playu
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: uat-admin-platform-readiness
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Clean generated build files
        script: flutter clean
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Run static analysis
        script: flutter analyze
      - name: Run automated tests
        script: flutter test
      - name: Install CocoaPods dependencies
        script: |
          find ios -name "Podfile" -execdir pod install \;
      - name: Configure iOS code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --dart-define=APPLE_SIGN_IN_ENABLED=true \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # Distribute processed builds directly to the existing internal group.
        submit_to_testflight: true
        beta_groups:
          - TE testing
